<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LLM Cheat Sheet</title>
    <link rel="stylesheet" href="css/card.css">
  </head>
  <body>
    <div class="card">
      <header>
        <div class="title-row">
          <h1>LLM Cheat Sheet</h1>
          <time id="updated-at"></time>
        </div>
        <div class="view-toggle" role="group" aria-label="List order">
          <button type="button" id="view-jobs" aria-pressed="true">By job</button>
          <button type="button" id="view-models" aria-pressed="false">By model</button>
        </div>
      </header>
      <ol id="jobs"></ol>
    </div>
    <script src="data/card-data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
